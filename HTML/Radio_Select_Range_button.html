<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit</title>
</head>
<body>
    <form action="server/">
        <div>
            <input type="radio" name="fruit" id="apple" value="apple">
            <label for="apple">Apple</label value=apple>
            <input type="radio" name="fruit" id="mango" value="mango">
            <label for="mango">Mango</label>
            <input type="radio" name="fruit" id="banana" value="banana">
            <label for="banana">Banana</label>
            <button>submit</button>
        </div>
        <div>
            Choose your subjects:
            <input type="checkbox" name="sub" id="maths" value="maths">
            <label for="maths">Maths</label value="math">
            <input type="checkbox" name="sub" id="phy" value="phy">
            <label for="phy">Physics</label>
            <input type="checkbox" name="sub" id="chem" value="chem">
            <label for="chem">chemistry</label> 
            <button>submit</button>
        </div>
        <div>
            Choose your profession :
            <select name="profession" id="profession">
                <option>Select your option</option>
                <option value="stu" selected>Student</option>
                <option value="dev">Developer</option>
                <button>submit</button>
            </select>    
        </div>
        <div>
            <label for="vol">Select your Volume level : </label>
            <input type="range" id="vol" min="0" max="100" name="vol" step="10" value="70">
            <button>submit</button>
        </div>      
    </form>
</body>
</html>
