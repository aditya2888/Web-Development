<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2><b>Feedback Form</b></h2>
    <form action="server/">
        <div>
        <label for="name">Name: </label>
        <input type="text" name="name" id="name" placeholder="Write your name"> 
        <br>
        <label for="email">Email: </label>
        <input type="text" name="email" id="email" placeholder="write your email">
        </div>
        <div>
        <label for="message">Message:</label>
        <br>
        <textarea name="message" id="message" col="5" row="3"></textarea>
        </div>
        <br>
        <div>
            Rate us our of 5:
            <br>
            <label for="1">1</label>
            <input type="radio" name="rating" id="1" value="1">
            <br>
            <label for="2">2</label>
            <input type="radio" name="rating" id="2" value="2">
            <br>
            <label for="3">3</label>
            <input type="radio" name="rating" id="3" value="3">
            <br>
            <label for="4">4</label>
            <input type="radio" name="rating" id="4" value="4">
            <br>
            <label for="5">5</label>
            <input type="radio" name="rating" id="5" value="5">
        </div>
        <button>Send your message!</button>
    </form>
</body>
